name: Bootstrap Android port

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand prepared project
        shell: bash
        run: |
          cat > /tmp/port.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/port.b64 > /tmp/port.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/port.tar.gz -C .
          rm -f .github/workflows/bootstrap.yml
      - name: Commit port foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap Android port with desktop config compatibility"
          git push origin HEAD:main
