name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "port/v1-android" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBulletCE-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --cleanup-tag --yes || true
          gh release create mobile-latest             app/build/outputs/apk/debug/app-debug.apk             --title "OpenBulletCE Mobile - latest debug APK"             --notes "Automatic debug build from commit ${GITHUB_SHA}."             --prerelease             --target "${GITHUB_SHA}"
